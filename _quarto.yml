project:
  type: website
  output-dir: _site
  pre-render:
    - python scripts/update_profile_readme.py

website:
  title: "beomdo's ML-DL blog"
  site-url: "https://beomdo-park.github.io"
  site-path: "/"
  description: "머신러닝, 데이터 분석, AI 블로그"
  open-graph: true

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
    right:
      - text: QEnvS
        href: https://github.com/beomdo-park/QEnvS
      - text: Portfolio
        href: https://github.com/beomdo-park/Portfolio
      - icon: github
        href: https://github.com/beomdo-park

  page-footer:
    left: "© 2026, Beomdo-Park. Powered by Quarto."
    right:
      - icon: github
        href: https://github.com/beomdo-park/
      - text: Sitemap
        href: https://beomdo-park.github.io/sitemap.xml

format:
  html:
    include-in-header:
      text: |
        <meta name="google-site-verification" content="tQV_UbBEk_vL_s9vxCne2Yd0GPHJ4vn8s2pPhfV0PYo" />
        <meta name="naver-site-verification" content="6c1006d6edf85b99c51f1f82aabd2a4fd68ec739" />
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    respect-user-color-scheme: true
